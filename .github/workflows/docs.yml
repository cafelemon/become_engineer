          marker_dir="site-src/deployment-revisions"
          marker_file="$marker_dir/$GITHUB_SHA.json"
          mkdir -p "$marker_dir"
          printf '{"source_sha":"%s","workflow_run_id":"%s","repository":"%s"}\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_REPOSITORY" > "$marker_file"

