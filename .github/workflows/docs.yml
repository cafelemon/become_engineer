      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force --clean --verbose

      - name: Verify public Pages serves this main revision
        run: |
          set -eu
          deployment_url="https://cafelemon.github.io/become_engineer/deployment-revisions/$GITHUB_SHA.json"
          verified=false
          for attempt in $(seq 1 36); do
            if curl --fail --silent --show-error --max-time 20 \
              "$deployment_url?attempt=$attempt" \
              --output /tmp/pages-deployment.json \
              && python -c 'import json, os; data=json.load(open("/tmp/pages-deployment.json", encoding="utf-8")); assert data["source_sha"] == os.environ["GITHUB_SHA"]; assert data["repository"] == os.environ["GITHUB_REPOSITORY"]'; then
              verified=true
              break
            fi
            sleep 5
          done
          test "$verified" = true
          echo "GitHub Pages is serving source revision $GITHUB_SHA"
