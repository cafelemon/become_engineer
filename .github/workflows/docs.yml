      - name: Verify machine-learning preprocessing pipeline contracts
        run: node scripts/test_machine_learning_02_v2.mjs

      - name: Verify machine-learning logistic regression contracts
        run: node scripts/test_machine_learning_03_v2.mjs

      - name: Verify machine-learning decision tree contracts
        run: node scripts/test_machine_learning_04_v2.mjs

      - name: Verify machine-learning model selection contracts
        run: node scripts/test_machine_learning_05_v2.mjs

      - name: Verify machine-learning unsupervised contracts
        run: node scripts/test_machine_learning_06_v2.mjs

      - name: Verify machine-learning calibration and group errors
        run: node scripts/test_machine_learning_07_v2.mjs

      - name: Verify machine-learning persistence and inference contracts
        run: node scripts/test_machine_learning_08_v2.mjs

      - name: Verify deep-learning tensor contracts
        run: node scripts/test_deep_learning_01_v2.mjs

      - name: Verify deep-learning forward network contracts
        run: node scripts/test_deep_learning_02_v2.mjs

      - name: Verify deep-learning gradient contracts
        run: node scripts/test_deep_learning_03_v2.mjs

      - name: Verify deep-learning training-loop contracts
        run: node scripts/test_deep_learning_04_v2.mjs

      - name: Verify deep-learning validation and regularization contracts
        run: node scripts/test_deep_learning_05_v2.mjs

      - name: Verify deep-learning initialization and gradient diagnostics
        run: node scripts/test_deep_learning_06_v2.mjs

      - name: Verify deep-learning checkpoint and exact resume
        run: node scripts/test_deep_learning_07_v2.mjs

      - name: Verify deep-learning inference delivery contracts
        run: node scripts/test_deep_learning_08_v2.mjs

      - name: Verify LLM model boundary and offline adapter
        run: node scripts/test_llm_use_01_v2.mjs

      - name: Verify LLM prompt contract and budget
        run: node scripts/test_llm_use_02_v2.mjs

      - name: Verify LLM structured output validation
        run: node scripts/test_llm_use_03_v2.mjs

      - name: Verify LLM bounded failure recovery
        run: node scripts/test_llm_use_04_v2.mjs

      - name: Verify LLM streaming lifecycle
        run: node scripts/test_llm_use_05_v2.mjs

      - name: Verify LLM provider configuration and secure delivery
        run: node scripts/test_llm_use_06_v2.mjs

      - name: Verify RAG corpus identity and reproducible index
        run: node scripts/test_llm_rag_eval_01_v2.mjs

      - name: Verify RAG BM25 lexical baseline
        run: node scripts/test_llm_rag_eval_02_v2.mjs

      - name: Verify RAG chunk and exact citation contracts
        run: node scripts/test_llm_rag_eval_03_v2.mjs

      - name: Verify RAG vector and hybrid retrieval contracts
        run: node scripts/test_llm_rag_eval_04_v2.mjs

      - name: Verify RAG grounded answer and abstention contracts
        run: node scripts/test_llm_rag_eval_05_v2.mjs

      - name: Verify RAG fixed evaluation and regression gates
        run: node scripts/test_llm_rag_eval_06_v2.mjs

      - name: Verify Agent tool registry and candidate call contracts
        run: node scripts/test_agent_tool_calling_01_v2.mjs

      - name: Verify Agent business validation, authorization, and read-only execution
        run: node scripts/test_agent_tool_calling_02_v2.mjs

      - name: Verify Agent multiple-call correlation and partial-failure isolation
        run: node scripts/test_agent_tool_calling_03_v2.mjs

      - name: Verify Agent controlled side effects, confirmation, and idempotency
        run: node scripts/test_agent_tool_calling_04_v2.mjs

      - name: Verify Agent bounded tool loop, budgets, and terminal states
        run: node scripts/test_agent_tool_calling_05_v2.mjs

      - name: Verify Agent fixed adversarial evaluation and regression delivery
        run: node scripts/test_agent_tool_calling_06_v2.mjs

      - name: Verify Agent durable run state, event log, and atomic checkpoint
        run: node scripts/test_agent_engineering_01_v2.mjs

      - name: Verify Agent memory provenance, consent, TTL, and context budget
        run: node scripts/test_agent_engineering_02_v2.mjs

      - name: Verify Agent lease, idempotent step, and crash resume
        run: node scripts/test_agent_engineering_03_v2.mjs

      - name: Verify Agent trajectory, telemetry, and security delivery
        run: |
          node scripts/test_agent_engineering_04_v2.mjs
          node scripts/test_agent_engineering_05_v2.mjs
          node scripts/test_agent_engineering_06_v2.mjs

      - name: Verify RAG application engineering with real pgvector
        run: |
          set -eu
          container=rag-application-pgvector-ci
          cleanup_pgvector() { docker rm -f "$container" >/dev/null 2>&1 || true; }
          trap cleanup_pgvector EXIT
          node scripts/test_rag_application_engineering_01_v2.mjs
          node scripts/test_rag_application_engineering_02_v2.mjs
          docker run -d --name "$container" \
            -e POSTGRES_DB=rag_lab \
            -e POSTGRES_USER=rag \
            -e POSTGRES_PASSWORD=rag-ci-only \
            -p 127.0.0.1:55440:5432 \
            pgvector/pgvector:0.8.2-pg16-bookworm
          ready=false
          for attempt in $(seq 1 30); do
            if docker exec "$container" pg_isready -U rag -d rag_lab; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          RAG_PGVECTOR_URL=postgresql://rag:rag-ci-only@127.0.0.1:55440/rag_lab \
            node scripts/test_rag_application_engineering_03_v2.mjs
          node scripts/test_rag_application_engineering_04_v2.mjs
          node scripts/test_rag_application_engineering_05_v2.mjs
          node scripts/test_rag_application_engineering_06_v2.mjs
          docker exec "$container" createdb -U rag rag_app
          docker exec -i "$container" psql -U rag -d rag_app \
            < site-src/examples/rag-application-engineering/intelligent-learning-assistant-v30/schema.sql
          RAG_APP_DATABASE_URL=postgresql://rag:rag-ci-only@127.0.0.1:55440/rag_app \
            .venv/bin/python -m unittest -v \
            site-src/examples/rag-application-engineering/intelligent-learning-assistant-v30/test_postgres_schema.py

      - name: Verify Agent application orchestration with real PostgreSQL
        env:
          AGENT_POSTGRES_URL: postgresql://dashboard:dashboard@127.0.0.1:55439/dashboard
        run: |
          set -eu
          node scripts/test_agent_application_orchestration_01_v2.mjs
          node scripts/test_agent_application_orchestration_02_v2.mjs
          node scripts/test_agent_application_orchestration_03_v2.mjs
          node scripts/test_agent_application_orchestration_04_v2.mjs
          node scripts/test_agent_application_orchestration_05_v2.mjs
          node scripts/test_agent_application_orchestration_06_v2.mjs
          docker run --rm --network host \
