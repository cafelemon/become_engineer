services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agent_jobs
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent-local-only
    ports: ["127.0.0.1::5432"]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U agent -d agent_jobs"]
      interval: 1s
      timeout: 2s
      retries: 30
