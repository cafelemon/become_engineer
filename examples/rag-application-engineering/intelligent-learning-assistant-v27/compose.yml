services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg16-bookworm
    environment:
      POSTGRES_DB: rag_lab
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag-local-only
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag_lab"]
      interval: 1s
      timeout: 2s
      retries: 30
